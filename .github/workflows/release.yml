name: release

# Builds Resodoom for the two platforms Resolume runs on, and publishes it:
#   - macOS   -> universal (arm64 + x86_64) Resodoom.bundle, four engines in
#                Contents/Frameworks
#   - Windows -> x64 Resodoom.dll with its four engine DLLs BESIDE it (GLEW
#                static via vcpkg), as a zip and an NSIS setup.exe
#
# The Linux branch has never been built or run, and an untested binary of a
# thing that hosts a game engine is worse than no binary, so it stays
# source-only until somebody can actually run one.
#
# Trigger manually (Actions > release > Run workflow) or by pushing a v* tag.
# A workflow_dispatch run builds everything and skips publication, which is the
# cheap way to prove Windows still compiles before tagging.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-universal, os: macos-14 }
          - { name: windows-x86_64,  os: windows-latest }
    steps:
      # The runner's system git has core.autocrlf=true, which would check the
      # sources AND patches/*.patch out with CRLF endings. The engine is built
      # from a copy of doomgeneric that `git apply` patches in the build tree,
      # so keep every byte as committed.
      - name: Keep line endings as committed
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      # GLEW comes from vcpkg (vcpkg.json), static-linked -- static-md keeps
      # the CRT dynamic so the plugin matches the host -- so the DLL needs no
      # glew32.dll beside it.
      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: >
          cmake -B build -A x64
          -DCMAKE_BUILD_TYPE=Release
          -DVCPKG_TARGET_TRIPLET=x64-windows-static-md
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Derive version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      # The engine runs with no WAD, so CI can prove the whole load path works
      # without shipping or downloading any game data: the harness asserts that
      # a missing WAD is refused with a message rather than crashing, which is
      # the failure an operator is most likely to meet.
      - name: Smoke test (no WAD required, macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          ./build/resotest --iwad /nonexistent/none.wad 2>&1 | tail -3 || true
          # A refusal is the expected outcome; a crash is not.
          set +e
          ./build/resotest --iwad /nonexistent/none.wad >/dev/null 2>&1
          rc=$?
          set -e
          if [ "$rc" -gt 128 ]; then
            echo "resotest died on a signal ($rc) instead of refusing the WAD"
            exit 1
          fi
          echo "refused cleanly with exit $rc"

      # PowerShell, not bash: a Windows crash is an NTSTATUS such as
      # 0xC0000005, which bash truncates to its low byte (5) and would read as
      # a clean refusal. $LASTEXITCODE keeps all 32 bits, so it is negative.
      - name: Smoke test (no WAD required, Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & .\build\Release\resotest.exe --iwad C:\nonexistent\none.wad 2>&1 | Select-Object -Last 3
          $rc = $LASTEXITCODE
          if ($rc -lt 0 -or $rc -gt 255) {
            Write-Error ("resotest crashed (0x{0:X8}) instead of refusing the WAD" -f $rc)
            exit 1
          }
          Write-Output "refused cleanly with exit $rc"
          exit 0

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p out
          if [ "${{ runner.os }}" = "macOS" ]; then
            cp -R "build/Resodoom.bundle" "out/Resodoom.bundle"

            # Actions runs `shell: bash` as `bash -eo pipefail`, so `cmd | grep -q X`
            # FAILS when grep FINDS its match: grep exits at once, the writer takes
            # SIGPIPE, and pipefail reports the pipeline as failed -- failing the
            # release on a correct binary. Captured and matched with `case` instead.
            __archs=$( lipo -archs "out/Resodoom.bundle/Contents/MacOS/Resodoom" )
            echo "plugin archs: $__archs"
            case "$__archs" in
              *arm64*) ;;
              *) echo "expected arm64, got: $__archs"; exit 1 ;;
            esac
            case "$__archs" in
              *x86_64*) ;;
              *) echo "expected x86_64, got: $__archs"; exit 1 ;;
            esac

            # The engines are separate libraries staged inside the bundle, one
            # per aspect, and every one has to be there and universal -- a thin
            # engine beside a universal plugin loads on one Mac and refuses every
            # WAD on the other, and a missing one quietly falls back to 4:3.
            # These are CMakeLists.txt's RESODOOM_ENGINE_WIDTHS.
            __engines=""
            for __w in 320 384 426 568; do
              if [ "$__w" = 320 ]; then __n=libresodoom_engine.dylib;
              else __n="libresodoom_engine_$__w.dylib"; fi
              __e="out/Resodoom.bundle/Contents/Frameworks/$__n"
              test -f "$__e" || { echo "the $__w engine is not in the bundle"; exit 1; }
              __earchs=$( lipo -archs "$__e" )
              echo "$__n archs: $__earchs"
              case "$__earchs" in
                *arm64*x86_64*|*x86_64*arm64*) ;;
                *) echo "the $__w engine is not universal: $__earchs"; exit 1 ;;
              esac
              __engines="$__engines $__e"
            done

            # The registration lives in a file-scope constructor nothing names, so
            # a linker that dropped the translation unit would still produce a
            # loadable bundle that reports it contains no plugins.
            __symbols=$( nm -gU "out/Resodoom.bundle/Contents/MacOS/Resodoom" )
            case "$__symbols" in
              *_plugMain*) ;;
              *) echo "expected _plugMain"; exit 1 ;;
            esac

            # Each engine exports its stagehand entry point. doomgeneric has
            # several hundred file-scope globals and none of them belong in the
            # host's namespace.
            for __e in $__engines; do
              __esyms=$( nm -gU "$__e" )
              case "$__esyms" in
                *stagehand_source_api*) ;;
                *) echo "$__e has no stagehand entry point"; exit 1 ;;
              esac
            done
          else
            # Windows keeps the engines BESIDE Resodoom.dll: that is the first
            # place Plugin.cpp's EngineLibraryPath() looks, and Arena's scan
            # tries each of them as an FFGL and a VST, finds neither and skips
            # it without a word (checked in Arena 7.27.1). So the zip is flat,
            # and whatever folder Resolume is pointed at gets all five.
            cp "build/Release/Resodoom.dll" out/
            for __w in 320 384 426 568; do
              if [ "$__w" = 320 ]; then __n=resodoom_engine.dll;
              else __n="resodoom_engine_$__w.dll"; fi
              test -f "build/Release/$__n" || { echo "the $__w engine was not built"; exit 1; }
              cp "build/Release/$__n" out/
            done
            # The plugin must not need a glew32.dll the host does not have.
            if ls build/Release/glew32*.dll >/dev/null 2>&1; then
              echo "GLEW was linked dynamically; the triplet should make it static"; exit 1
            fi
          fi

          # GPL-2.0, and the licence has to travel with the binary.
          cp LICENSE out/LICENSE
          cp README.md out/ 2>/dev/null || true
          cp docs/USER-GUIDE.md out/ 2>/dev/null || true
          ls -R out

      - name: Archive (zip)
        shell: bash
        run: |
          cd out
          if command -v 7z >/dev/null 2>&1; then
            7z a "../resodoom-${{ matrix.name }}.zip" ./*
          else
            zip -r "../resodoom-${{ matrix.name }}.zip" ./*
          fi

      - name: Disk image (macOS)
        if: runner.os == 'macOS'
        shell: bash
        # A .dmg, but deliberately NOT a .pkg. An FFGL plugin's destination is
        # per-user and edition-specific -- the README installs to
        # ~/Documents/Resolume {Arena,Avenue}/Extra Effects -- so a .pkg would
        # have to guess a path and would silently install to the wrong one for
        # half of users.
        run: |
          source scripts/release-lib.sh
          rl_init "Resodoom" resodoom "${{ steps.ver.outputs.version }}" \
            com.stoatworks.ffgl.resodoom "$GITHUB_WORKSPACE"
          rl_adhoc_sign "out/Resodoom.bundle"
          rl_dmg "macos-universal" out

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: resodoom-${{ matrix.name }}
          retention-days: 1
          path: |
            *.zip
            *.dmg
          if-no-files-found: error

  windows-installer:
    name: Windows installer
    needs: build
    runs-on: ubuntu-latest
    # makensis cross-compiles, so the installer is wrapped here from the zip the
    # Windows job uploaded -- the same five DLLs, flat, so the engines land
    # beside Resodoom.dll. Its directory page stays editable, because Resolume
    # reads plugins from a folder the user chooses.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Install NSIS
        run: sudo apt-get update && sudo apt-get install -y nsis

      - name: Build installer
        shell: bash
        run: |
          source scripts/release-lib.sh
          version="${GITHUB_REF_NAME#v}"
          case "$version" in [0-9]*) ;; *) version="0.0.0" ;; esac
          rl_init "Resodoom" resodoom "$version" com.stoatworks.ffgl.resodoom "$PWD/installers"
          zip="$(find artifacts -name "resodoom-windows-x86_64.zip" | head -1)"
          if [ -z "$zip" ]; then echo "no Windows artefact"; exit 1; fi
          stage="$RUNNER_TEMP/stage-win"
          rm -rf "$stage"; mkdir -p "$stage"
          unzip -q "$zip" -d "$stage"
          # --plain: a plugin needs neither a shortcut nor a PATH entry (nib#2).
          rl_nsis windows-x86_64 "$stage" --plain
          ls -l installers
          test -n "$(find installers -name '*-setup.exe')" || { echo "no setup.exe was written"; exit 1; }

      - uses: actions/upload-artifact@v7
        with:
          name: resodoom-windows-installer
          retention-days: 1
          path: installers/*.exe
          if-no-files-found: error

  release:
    name: Publish release
    needs: [build, windows-installer]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*
          generate_release_notes: true
